name: Bug report
description: Something in cratezig behaves wrongly, crashes, leaks, or differs from dockerd.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue. Search existing issues first.
        Security problems: do not file publicly. See SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences. What is wrong?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api / http server
        - containers / runtime
        - images / registry
        - networking
        - volumes / mounts
        - builder
        - daemon / config / ops
        - docker CLI or compose compatibility
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical (crash, data loss, security)
        - high (common docker workflow broken)
        - medium (feature partly wrong, workaround exists)
        - low (cosmetic, rare edge case)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands. Include the daemon config if it is not the default.
      placeholder: |
        1. sudo cratezig daemon
        2. DOCKER_HOST=unix:///var/run/cratezig.sock docker run --rm alpine echo hi
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected (what dockerd does)
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Output, HTTP status, and the relevant daemon log lines.
      render: shell
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Code location (if known)
      placeholder: src/server/server.zig handleConnection
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      value: |
        - OS / kernel:
        - Running as root: yes/no
        - runc version:
        - docker CLI version:
